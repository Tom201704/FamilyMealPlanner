<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dinner Planner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍲</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">🍲 Dinner Planner</div>
  <nav class="tabs" id="tabs">
    <button data-tab="overview">Weeks</button>
    <button data-tab="plan">Plan</button>
    <button data-tab="recipes">Recipes</button>
    <button data-tab="settings">Settings</button>
  </nav>
  <div class="status" id="status"></div>
</header>
<div id="banner"></div>
<main id="app"><p class="muted">Loading…</p></main>
<div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dinner Planner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍲</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">🍲</span> Dinner Planner</div>
  <nav class="tabs" id="tabs">
    <button data-tab="overview"><span class="ti">🗓️</span> Overview</button>
    <button data-tab="plan"><span class="ti">🎲</span> Plan</button>
    <button data-tab="recipes"><span class="ti">📖</span> Recipes</button>
    <button data-tab="groceries"><span class="ti">🛒</span> Groceries <span class="tbadge hidden" id="gcount"></span></button>
    <button data-tab="settings"><span class="ti">⚙️</span> Settings</button>
  </nav>
  <div class="status" id="status"></div>
</header>
<div id="banner"></div>
<main id="app"><p class="muted">Loading…</p></main>
<div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="config.js?v=5"></script>
<script src="app.js?v=5"></script>
</body>
</html>
